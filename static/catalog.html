<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b10">
<title>Словарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0b10;
    --card: #14141c;
    --card-2: #1b1b25;
    --line: #23232e;
    --text: #f4f1ec;
    --muted: #8d8a93;
    --faint: #56545f;
    --accent: #7fd6ff;
    --accent-2: #6b7bff;
    --ok: #57d9a3;
    --danger: #ff5d5d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); }
  body {
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px);
    -webkit-font-smoothing: antialiased;
  }

  header { padding: 18px 16px 12px; }
  .title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
  .sub { color: var(--muted); font-size: 14px; margin: 4px 0 14px; }
  .bar { height: 6px; border-radius: 99px; background: var(--card-2); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .6s cubic-bezier(.2,.8,.2,1); }

  .tabs { display: flex; gap: 4px; margin: 16px 16px 0; padding: 4px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .tab { flex: 1 1 0; border: 0; background: none; color: var(--muted);
    font-size: 15px; font-weight: 500; padding: 9px 8px; border-radius: 10px; cursor: pointer;
    transition: background .2s, color .2s; }
  .tab[aria-selected="true"] { background: var(--card-2); color: var(--text); }

  .sticky {
    position: sticky; top: 0; z-index: 5;
    background: linear-gradient(180deg, rgba(11,11,16,.97) 72%, rgba(11,11,16,0));
    padding: 10px 16px 12px;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .search { position: relative; }
  .search input {
    width: 100%; height: 44px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-size: 16px;
    padding: 0 40px; outline: none; transition: border-color .2s, background .2s;
  }
  .search input:focus { border-color: var(--accent); background: var(--card-2); }
  .search input::placeholder { color: var(--faint); }
  .search .icon { position: absolute; left: 14px; top: 12px; color: var(--faint); font-size: 17px; }
  .search .clear {
    position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border: 0; border-radius: 50%;
    background: var(--card-2); color: var(--muted); font-size: 15px; display: none; cursor: pointer;
  }
  .search .clear.on { display: block; }

  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 99px; padding: 7px 14px; font-size: 14px; cursor: pointer;
    transition: color .2s, border-color .2s, background .2s;
  }
  .chip[aria-pressed="true"] { color: #0b0b10; background: var(--accent); border-color: var(--accent); font-weight: 500; }

  .modes { display: flex; gap: 8px; padding: 10px 0 0; }
  .modes .chip { flex: 0 0 auto; }

  /* Topics: one row by default, the arrow opens the full grid — 50 topics in a
     side-scrolling strip were unusable (you couldn't see what was there). */
  .topics { padding: 10px 0 0; }
  /* Two rows collapsed: topic names are long, so one row would often show a single chip. */
  .cats { display: flex; flex-wrap: wrap; gap: 8px; max-height: 80px; overflow: hidden;
          transition: max-height .28s ease; }
  .cats.open { max-height: 50vh; overflow-y: auto; padding-bottom: 2px; }
  .cats .chip { white-space: nowrap; }
  .cats .chip[aria-pressed="true"] { background: var(--card-2); color: var(--text); border-color: var(--accent); }
  .more {
    margin-top: 8px; width: 100%; border: 1px dashed var(--line); background: none;
    color: var(--muted); border-radius: 12px; padding: 8px; font-size: 13px; cursor: pointer;
  }
  .more .chev { display: inline-block; transition: transform .28s ease; }
  .more.open .chev { transform: rotate(180deg); }

  .count { color: var(--faint); font-size: 13px; padding: 2px 16px 8px; }

  ul { list-style: none; margin: 0; padding: 0 16px; }
  li {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 11px 12px 11px 14px; margin-bottom: 8px;
    animation: rise .25s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  li.have { background: transparent; border-color: transparent; }
  li.sec {
    background: none; border: 0; padding: 18px 2px 8px; margin: 0;
    color: var(--faint); font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
    animation: none;
  }
  li.sec b { color: var(--muted); font-weight: 500; }
  .n { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 34px; }
  .txt { flex: 1 1 auto; min-width: 0; }
  .es { font-size: 16px; font-weight: 500; letter-spacing: -0.01em; }
  li.have .es { color: var(--muted); font-weight: 400; }
  .ru { color: var(--muted); font-size: 13px; margin-top: 1px; }
  .cat { color: var(--faint); font-size: 11px; margin-top: 2px; }
  .tag {
    display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 99px;
    font-size: 10px; letter-spacing: .04em; vertical-align: middle;
    color: var(--accent); border: 1px solid var(--line); background: var(--card-2);
  }

  .act {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--card-2); color: var(--accent);
    font-size: 19px; line-height: 1; display: grid; place-items: center; cursor: pointer;
    transition: transform .15s, background .2s, color .2s, border-color .2s;
  }
  .act:active { transform: scale(.9); }
  .act.done { color: var(--ok); border-color: transparent; background: transparent; font-size: 16px; }
  .act.err { color: var(--danger); }
  /* «знаю»: known without a card — secondary to «+», and a marked row's ✓ undoes it. */
  .knew {
    flex: 0 0 auto; height: 30px; padding: 0 10px; border-radius: 99px;
    border: 1px solid var(--line); background: none; color: var(--muted);
    font-size: 12px; cursor: pointer; transition: transform .15s, color .2s;
  }
  .knew:active { transform: scale(.94); }
  .act.marked { color: var(--muted); border-color: var(--line); background: transparent; font-size: 16px; }
  .tag.knew-tag { color: var(--muted); }
  .act[disabled] { cursor: default; }
  .act .sp {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid var(--faint); border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { color: var(--muted); text-align: center; padding: 40px 24px; font-size: 15px; }
  #sentinel { height: 1px; }

  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px);
    background: var(--card-2); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; font-size: 14px; color: var(--text);
    opacity: 0; transform: translateY(12px); transition: opacity .25s, transform .25s;
    pointer-events: none; z-index: 10;
  }
  .toast.on { opacity: 1; transform: none; }
</style>
</head>
<body>
<header>
  <h1 class="title" id="title">Словарь</h1>
  <p class="sub" id="sub">Загружаю…</p>
  <div class="bar"><i id="barFill"></i></div>
</header>

<div class="tabs" role="tablist">
  <button class="tab" id="tabWords" role="tab" aria-selected="true">Слова</button>
  <button class="tab" id="tabPhrases" role="tab" aria-selected="false">Фразы</button>
</div>

<div class="sticky">
  <div class="search">
    <span class="icon">⌕</span>
    <input id="q" type="search" placeholder="Поиск по слову или переводу" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="clear" aria-label="Очистить">✕</button>
  </div>
  <div class="modes" id="modes">
    <button class="chip" data-mode="new" aria-pressed="true">Новые</button>
    <button class="chip" data-mode="have" aria-pressed="false">Уже есть</button>
    <button class="chip" data-mode="all" aria-pressed="false">Все</button>
  </div>
  <div class="topics">
    <div class="cats" id="cats"></div>
    <button class="more" id="more">Все темы <span class="chev">⌄</span></button>
  </div>
</div>

<div class="count" id="count"></div>
<ul id="list"></ul>
<div id="sentinel"></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
const linkToken = new URLSearchParams(location.search).get('t') || '';
const PAGE = 60;
const REGION_LABEL = { es: 'Испания', la: 'Лат. Америка' };

const data = { words: [], phrases: [] };
let known = new Set();   // in the dictionary (has a card)
let marked = new Set();  // marked «знаю» — no card
const isHave = (w) => { const k = normalize(w.es); return known.has(k) || marked.has(k); };
let tab = 'words';
let view = [];
let shown = 0;
let lastCat = '';
let mode = 'new';
let query = '';
const chosenCat = { words: '', phrases: '' };
let catsOpen = false;

const $ = (id) => document.getElementById(id);
const items = () => data[tab];
const category = () => chosenCat[tab];

function headers() {
  const h = { 'Content-Type': 'application/json' };
  const initData = tg && tg.initData;
  if (initData) h['X-Tg-Init-Data'] = initData;
  else if (linkToken) h['X-Talk-Token'] = linkToken;
  return h;
}

function normalize(s) {
  const t = (s || '').trim().toLowerCase().replace(/^[¿¡]+|[?!.,;:…]+$/g, '');
  const m = t.match(/^(el|la|los|las|un|una|unos|unas)\s+(.*)$/);
  return m ? m[2] : t;
}

function haptic(kind) {
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(kind); } catch (e) {}
}

let toastTimer;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2600);
}

function plural(n, forms) {
  const d10 = n % 10, d100 = n % 100;
  if (d10 === 1 && d100 !== 11) return forms[0];
  if (d10 >= 2 && d10 <= 4 && (d100 < 12 || d100 > 14)) return forms[1];
  return forms[2];
}

function progress() {
  const list = items();
  const have = list.filter(isHave).length;
  const knew = list.filter((w) => { const k = normalize(w.es); return marked.has(k) && !known.has(k); }).length;
  const noun = tab === 'words' ? 'слов' : 'фраз';
  $('sub').textContent = `${have} из ${list.length} ${noun} уже есть`
    + (knew ? ` · ${knew} отмечено «знаю»` : '');
  $('barFill').style.width = (list.length ? (have / list.length) * 100 : 0) + '%';
}

function renderCats() {
  const counts = new Map();
  for (const w of items()) if (w.cat) counts.set(w.cat, (counts.get(w.cat) || 0) + 1);
  const box = $('cats');
  box.innerHTML = '';
  box.classList.toggle('open', catsOpen);

  const chip = (value, label) => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = label;
    b.dataset.cat = value;
    b.setAttribute('aria-pressed', String(value === category()));
    return b;
  };
  box.appendChild(chip('', 'Все темы'));
  // Collapsed, the picked topic rides at the front so the active filter stays visible
  // even when it lives at the bottom of the list.
  const names = [...counts.keys()];
  if (!catsOpen && category()) names.sort((a, b) => (a === category() ? -1 : b === category() ? 1 : 0));
  for (const name of names) box.appendChild(chip(name, `${name} · ${counts.get(name)}`));

  const more = $('more');
  more.classList.toggle('open', catsOpen);
  more.innerHTML = (catsOpen ? 'Свернуть темы ' : `Все темы (${counts.size}) `) + '<span class="chev">⌄</span>';
}

function applyFilter() {
  const q = query.trim().toLowerCase();
  const cat = category();
  view = items().filter((w) => {
    const have = isHave(w);
    if (mode === 'new' && have) return false;
    if (mode === 'have' && !have) return false;
    if (cat && w.cat !== cat) return false;
    if (q && !(w.es.toLowerCase().includes(q) || w.ru.toLowerCase().includes(q))) return false;
    return true;
  });
  shown = 0;
  lastCat = '';
  $('list').innerHTML = '';
  const noun = tab === 'words'
    ? plural(view.length, ['слово', 'слова', 'слов'])
    : plural(view.length, ['фраза', 'фразы', 'фраз']);
  $('count').textContent = view.length ? `${view.length} ${noun}` : '';
  if (!view.length) {
    $('list').innerHTML = '<li class="empty" style="display:block">Ничего не нашлось</li>';
    return;
  }
  renderMore();
}

function renderMore() {
  const slice = view.slice(shown, shown + PAGE);
  const frag = document.createDocumentFragment();
  // While browsing everything, topic headings keep a long list navigable; with a topic
  // picked or a search running they'd just repeat what the user already chose.
  const grouped = !category() && !query.trim();
  for (const w of slice) {
    if (grouped && w.cat && w.cat !== lastCat) {
      lastCat = w.cat;
      const sec = document.createElement('li');
      sec.className = 'sec';
      sec.innerHTML = '<b></b>';
      sec.querySelector('b').textContent = w.cat;
      frag.appendChild(sec);
    }
    frag.appendChild(row(w));
  }
  $('list').appendChild(frag);
  shown += slice.length;
}

function row(w) {
  const key = normalize(w.es);
  const inDict = known.has(key);
  const knew = !inDict && marked.has(key);
  const have = inDict || knew;
  const li = document.createElement('li');
  li.className = have ? 'have' : '';
  li.innerHTML = `
    <span class="n">${w.n}</span>
    <span class="txt">
      <span class="es"></span><span class="tagSlot"></span>
      <div class="ru"></div>
      ${category() || query ? '<div class="cat"></div>' : ''}
    </span>`;
  li.querySelector('.es').textContent = w.es;
  li.querySelector('.ru').textContent = w.ru;
  const catEl = li.querySelector('.cat');
  if (catEl) catEl.textContent = w.cat || '';
  if (w.region && REGION_LABEL[w.region]) {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = REGION_LABEL[w.region];
    li.querySelector('.tagSlot').appendChild(tag);
  }
  if (knew) {
    const tag = document.createElement('span');
    tag.className = 'tag knew-tag';
    tag.textContent = 'знаю';
    li.querySelector('.tagSlot').appendChild(tag);
  }

  const btn = document.createElement('button');
  if (inDict) {
    btn.className = 'act done';
    btn.textContent = '✓';
    btn.setAttribute('aria-label', 'Уже в словаре');
    btn.disabled = true;
  } else if (knew) {
    btn.className = 'act marked';
    btn.textContent = '✓';
    btn.setAttribute('aria-label', 'Снять отметку «знаю» с ' + w.es);
    btn.addEventListener('click', () => mark(w, li, false));
  } else {
    const k = document.createElement('button');
    k.className = 'knew';
    k.textContent = 'знаю';
    k.setAttribute('aria-label', 'Отметить «знаю»: ' + w.es);
    k.addEventListener('click', () => mark(w, li, true));
    li.appendChild(k);
    btn.className = 'act';
    btn.textContent = '+';
    btn.setAttribute('aria-label', 'Добавить ' + w.es);
    btn.addEventListener('click', () => add(w, li, btn));
  }
  li.appendChild(btn);
  return li;
}

// «Знаю» — no Claude call, so it's instant: flip locally, roll back if the server says no.
async function mark(w, li, on) {
  const key = normalize(w.es);
  const apply = (state) => {
    if (state) marked.add(key); else marked.delete(key);
    li.replaceWith(row(w));
    progress();
  };
  apply(on);
  haptic(on ? 'success' : 'warning');
  toast(on ? `${w.es} — отмечено «знаю», без карточки` : `${w.es} — отметка снята`);
  try {
    const res = await fetch('/catalog/mark', {
      method: 'POST', headers: headers(), body: JSON.stringify({ es: w.es, known: on }),
    });
    if (!res.ok) throw new Error('mark failed');
  } catch (e) {
    if (on) marked.delete(key); else marked.add(key);
    progress();
    applyFilter();
    haptic('error');
    toast('Не получилось сохранить отметку — попробуй ещё раз');
  }
}

async function add(w, li, btn) {
  btn.disabled = true;
  const knewBtn = li.querySelector('.knew');
  if (knewBtn) knewBtn.disabled = true;
  btn.textContent = '';
  btn.appendChild(Object.assign(document.createElement('span'), { className: 'sp' }));
  try {
    const res = await fetch('/catalog/add', {
      method: 'POST', headers: headers(), body: JSON.stringify({ es: w.es }),
    });
    const payload = await res.json().catch(() => ({}));
    const status = res.ok ? payload.status : 'error';
    if (status === 'added' || status === 'exists') {
      known.add(normalize(w.es));
      if (payload.phrase) known.add(normalize(payload.phrase));
      btn.textContent = '✓';
      btn.className = 'act done';
      if (knewBtn) knewBtn.remove();
      li.classList.add('have');
      progress();
      haptic('success');
      toast(status === 'added'
        ? `${payload.phrase || w.es} — добавлено, карточка готова`
        : `${payload.phrase || w.es} уже было в словаре`);
    } else if (status === 'limit') {
      btn.textContent = '+'; btn.className = 'act'; btn.disabled = false;
      if (knewBtn) knewBtn.disabled = false;
      haptic('warning');
      toast('Недельный лимит новых слов исчерпан');
    } else {
      throw new Error(payload.error || 'add failed');
    }
  } catch (e) {
    btn.textContent = '↻'; btn.className = 'act err'; btn.disabled = false;
    if (knewBtn) knewBtn.disabled = false;
    haptic('error');
    toast('Не получилось добавить — попробуй ещё раз');
  }
}

function switchTab(next) {
  if (tab === next) return;
  tab = next;
  catsOpen = false;
  $('tabWords').setAttribute('aria-selected', String(tab === 'words'));
  $('tabPhrases').setAttribute('aria-selected', String(tab === 'phrases'));
  $('q').placeholder = tab === 'words' ? 'Поиск по слову или переводу' : 'Поиск по фразе или переводу';
  $('title').textContent = tab === 'words' ? 'Топ-3000' : 'Живые фразы';
  progress();
  renderCats();
  applyFilter();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('tabWords').addEventListener('click', () => switchTab('words'));
$('tabPhrases').addEventListener('click', () => switchTab('phrases'));

$('modes').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  mode = chip.dataset.mode;
  for (const c of $('modes').children) c.setAttribute('aria-pressed', String(c === chip));
  applyFilter();
});

$('cats').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  chosenCat[tab] = chip.dataset.cat;
  catsOpen = false;  // picked one — fold the panel back up
  renderCats();
  applyFilter();
});

$('more').addEventListener('click', () => {
  catsOpen = !catsOpen;
  renderCats();
});

let searchTimer;
$('q').addEventListener('input', (e) => {
  query = e.target.value;
  $('clear').classList.toggle('on', !!query);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilter, 120);
});
$('clear').addEventListener('click', () => {
  query = ''; $('q').value = ''; $('clear').classList.remove('on'); applyFilter();
});

new IntersectionObserver((entries) => {
  if (entries[0].isIntersecting && shown < view.length) renderMore();
}, { rootMargin: '600px' }).observe($('sentinel'));

async function boot() {
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0b0b10'); } catch (e) {} }
  try {
    const [dataRes, stateRes] = await Promise.all([
      fetch('/catalog/data', { headers: headers() }),
      fetch('/catalog/state', { headers: headers() }),
    ]);
    if (dataRes.status === 401 || stateRes.status === 401) {
      $('sub').textContent = 'Открой словарь кнопкой из бота — ссылка устарела.';
      return;
    }
    const payload = await dataRes.json();
    data.words = payload.words || [];
    data.phrases = payload.phrases || [];
    const state = await stateRes.json();
    known = new Set(state.known || []);
    marked = new Set(state.marked || []);
  } catch (e) {
    $('sub').textContent = 'Не удалось загрузить список. Попробуй открыть заново.';
    return;
  }
  $('title').textContent = 'Топ-3000';
  progress();
  renderCats();
  applyFilter();
}

boot();
</script>
</body>
</html>
