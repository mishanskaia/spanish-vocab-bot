<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b10">
<title>Hablamos</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0b0b10;
    --text: #f4f1ec;
    --muted: #8d8a93;
    --faint: #4a4852;
    --warm-1: #ffb36b;
    --warm-2: #ff6f61;
    --cool-1: #7fd6ff;
    --cool-2: #6b7bff;
    --ring: #7fd6ff;
    --danger: #ff5d5d;
    --orb: 160px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0 0; min-height: 44px;
  }
  #status { color: var(--muted); font-size: 15px; }
  #diagBtn { border: 0; background: none; color: var(--faint); font-size: 20px; padding: 6px; }
  #diag {
    display: none; font: 12px/1.5 ui-monospace, Menlo, monospace; color: var(--muted);
    background: #15151c; border-radius: 12px; padding: 10px 12px; margin-top: 8px;
    white-space: pre-wrap; user-select: text; -webkit-user-select: text;
  }
  #diag.open { display: block; }

  #stage { flex: 0 0 auto; display: grid; place-items: center; padding: 24px 0 16px; }
  #orbWrap { position: relative; width: calc(var(--orb) + 28px); height: calc(var(--orb) + 28px); display: grid; place-items: center; }
  #ring { position: absolute; inset: 0; transform: rotate(-90deg); pointer-events: none; }
  #ring circle { fill: none; stroke: var(--ring); stroke-width: 3; stroke-linecap: round; opacity: .8; transition: stroke-dashoffset .1s linear; }
  #orb {
    width: var(--orb); height: var(--orb); border-radius: 50%; border: 0; padding: 0;
    background: radial-gradient(circle at 35% 30%, #fff8 0 6%, transparent 30%),
                radial-gradient(circle at 50% 55%, var(--warm-1), var(--warm-2) 70%);
    box-shadow: 0 0 60px -10px var(--warm-2);
    transition: filter .4s, box-shadow .4s;
    animation: breathe 4s ease-in-out infinite;
    cursor: pointer;
  }
  body[data-state="starting"] #orb { animation: spin 1.2s linear infinite; filter: saturate(.6); }
  body[data-state="listening"] #orb, body[data-state="thinking"] #orb {
    background: radial-gradient(circle at 35% 30%, #fff8 0 6%, transparent 30%),
                radial-gradient(circle at 50% 55%, var(--cool-1), var(--cool-2) 70%);
    box-shadow: 0 0 50px -12px var(--cool-2);
    animation: breathe 3s ease-in-out infinite;
  }
  body[data-state="listening"].voice #orb { animation: listen .8s ease-in-out infinite; box-shadow: 0 0 70px -4px var(--cool-2); }
  body[data-state="thinking"] #orb { animation: breathe 1.2s ease-in-out infinite; filter: brightness(.85); }
  body[data-state="speaking"] #orb { animation: speak .5s ease-in-out infinite alternate; box-shadow: 0 0 90px 0 var(--warm-2); }
  body[data-state="paused"] #orb, body[data-state="ended"] #orb { animation: none; filter: grayscale(1) brightness(.55); box-shadow: none; }
  @keyframes breathe { 0%,100% { transform: scale(.95); } 50% { transform: scale(1); } }
  @keyframes listen { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes speak { from { transform: scale(1); } to { transform: scale(1.09); } }
  @keyframes spin { from { transform: rotate(0) scale(.9); } to { transform: rotate(360deg) scale(.9); } }
  #hint { margin-top: 10px; color: var(--muted); font-size: 14px; min-height: 20px; text-align: center; }

  #subs {
    flex: 1 1 auto; overflow-y: auto; padding: 4px 0 16px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 36px);
            mask-image: linear-gradient(to bottom, transparent 0, #000 36px);
    user-select: text; -webkit-user-select: text;
  }
  .line { margin: 0 0 14px; transition: opacity .3s; }
  .line.assistant { font-size: 23px; line-height: 1.35; font-weight: 500; opacity: .5; }
  .line.assistant.latest { opacity: 1; }
  .line.assistant.dropped { font-size: 15px; opacity: .3; text-decoration: line-through; }
  .line.user { font-size: 15px; color: var(--muted); text-align: right; padding-left: 20%; }
  .line.user::before { content: "ты: "; color: var(--faint); }
  .line.pending { color: var(--faint); }
  .tr { margin: -8px 0 14px; font-size: 15px; color: var(--cool-1); }
  .tr::before { content: "🔎 "; }

  footer { display: flex; justify-content: center; gap: 28px; padding: 10px 0 18px; }
  .ctl {
    width: 60px; height: 60px; border-radius: 50%; border: 0; font-size: 22px;
    background: #1c1c24; color: var(--text); display: grid; place-items: center;
  }
  #endBtn { background: color-mix(in srgb, var(--danger) 22%, #1c1c24); color: var(--danger); }
  .ctl:disabled { opacity: .3; }
  #error { color: var(--danger); font-size: 14px; text-align: center; }
</style>
</head>
<body data-state="idle">
  <header>
    <div id="status">Нажми на шар, чтобы начать</div>
    <button id="diagBtn" aria-label="Диагностика">ⓘ</button>
  </header>
  <div id="diag"></div>

  <div id="stage">
    <div id="orbWrap">
      <svg id="ring" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96"></circle></svg>
      <button id="orb" aria-label="Начать / я договорила / пропустить"></button>
    </div>
    <div id="hint"></div>
  </div>

  <div id="subs" aria-live="polite"></div>
  <div id="error"></div>

  <footer>
    <button class="ctl" id="pauseBtn" aria-label="Пауза" disabled>❚❚</button>
    <button class="ctl" id="endBtn" aria-label="Закончить" disabled>✕</button>
  </footer>

<script>
(() => {
  // Pause handling — the whole point of this page (see CLAUDE.md «Живой разговор голосом»).
  // At A1 she stops mid-sentence to find a word, so "silence = done" would cut her off.
  // Starting guesses, meant to be tuned after live use.
  const CFG = {
    PAUSE_CHECK_MS: 1500,  // silence after speech → ask the server "did she finish?" (breaths inside speech reach ~1 s)
    STUCK_MS: 7000,        // silence this long → answer anyway and help with the word
    PREROLL_MS: 400,       // audio kept from before the voice was detected
    MIN_SPEECH_MS: 180,    // sustained voice to count as speech, not a click or cough
    VOICE_GAP_MS: 250,     // dips inside a word don't count as silence
    RUN_RESET_MS: 600,     // voice counter only resets after this much quiet — gaps between words don't
    BARGE_MS: 300,         // this much voice while the bot talks → she's interrupting
    // Voice detection. v1 averaged the "room level" over every frame not yet marked as speech, so
    // her own voice crept into it and the threshold climbed above her — the page heard silence
    // while she was talking and the bot cut in (first live test, 2026-09-19). Now the room level is
    // the quietest moment of the last 2 s: talking always dips to room level between words, so
    // speech can't drag it up, while steady background (TV, fan) becomes the new floor within 2 s.
    NOISE_WINDOW_MS: 2000,
    START_FACTOR: 3,       // voice starts at 3x the room level…
    KEEP_FACTOR: 2.2,      // …and once she's mid-utterance, quieter parts at 2.2x still count as voice
    BARGE_ECHO_FACTOR: 2.5, // while the bot talks: she must be 2.5x louder than its echo in the mic
    RESUME_GUARD_MS: 600,  // an answer that arrives while she's talking is stale — drop it, keep listening
    EARLY_BARGE_MS: 2500,  // interrupted this early → the bot jumped in too soon; drop its answer, merge her pieces
    ECHO_TAIL_MS: 350,     // ignore the mic right after the bot stops
    MAX_UTTER_MS: 60000,
    TARGET_RATE: 16000,
  };

  const tg = window.Telegram && window.Telegram.WebApp;
  const initData = (tg && tg.initData) || "";
  const linkToken = new URLSearchParams(location.search).get("t") || "";

  const $ = (id) => document.getElementById(id);
  const statusEl = $("status"), hintEl = $("hint"), subsEl = $("subs"), errEl = $("error");
  const pauseBtn = $("pauseBtn"), endBtn = $("endBtn");
  const ringCircle = document.querySelector("#ring circle");
  const RING_LEN = 2 * Math.PI * 96;
  ringCircle.style.strokeDasharray = RING_LEN;
  ringCircle.style.strokeDashoffset = RING_LEN;

  const diag = {
    "где": initData ? "Telegram" : (linkToken ? "браузер (ссылка)" : "без авторизации"),
    "микрофон": "—", "экран не гаснет": "—", "аудио": "—", "уровень / шум / порог": "—", "пик голоса": "—",
    "последний ход": "—", "сессия": "—",
  };
  function renderDiag() {
    $("diag").textContent = Object.entries(diag).map(([k, v]) => `${k}: ${v}`).join("\n");
  }
  renderDiag();
  $("diagBtn").onclick = () => $("diag").classList.toggle("open");

  if (tg) {
    try {
      tg.ready(); tg.expand();
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();
      tg.setHeaderColor && tg.setHeaderColor("#0b0b10");
      tg.setBackgroundColor && tg.setBackgroundColor("#0b0b10");
    } catch (e) {}
  }
  if (!initData && !linkToken) statusEl.textContent = "Открой страницу через /talk в боте";

  function authHeaders(json) {
    const h = json ? { "Content-Type": "application/json" } : {};
    if (initData) h["X-Tg-Init-Data"] = initData;
    else if (linkToken) h["X-Talk-Token"] = linkToken;
    return h;
  }

  // ---------- state ----------
  let state = "idle";
  let ctx = null, micStream = null, wakeLock = null, tickTimer = null;
  let sessionId = null;
  let player = null, playStartedAt = 0;
  let inflight = null, turnSeq = 0;
  let noise = 0.004, voicedRun = 0, voiceActive = false, lastVoicedAt = 0, ignoreUntil = 0;
  let noiseWin = [], noiseWinMs = 0, echo = 0.006, aboveStreak = 0, level = 0, lastThr = 0, peak = 0, runStartedAt = 0;
  let checkedFor = -1, stuckFor = -1, waitingHint = false;
  let preroll = [], prerollMs = 0;
  let utter = newUtter();
  let lastTurn = null;       // {userText, userEntry, botEntry} — for merging after an early answer
  const entries = [];        // subtitles and history, in order: {role, text, el, pending, dropped}
  const usage = {};

  function newUtter() { return { chunks: [], ms: 0, hasSpeech: false, prefix: "", entry: null, startedAt: 0 }; }

  const STATUS = {
    idle: "Нажми на шар, чтобы начать", starting: "Подключаюсь…", listening: "Слушаю",
    thinking: "Думаю…", speaking: "Говорит", paused: "Пауза", ended: "Разговор закончен",
  };
  function setState(s) {
    state = s;
    document.body.dataset.state = s;
    statusEl.textContent = STATUS[s] || "";
    if (s === "speaking") { voiceActive = false; voicedRun = 0; }
    renderHint();
  }
  function renderHint() {
    let h = "";
    if (state === "listening" && waitingHint) h = "Жду — подбирай слово спокойно";
    else if (state === "listening" && utter.hasSpeech) h = "Договорила? Нажми на шар";
    else if (state === "speaking") h = "Нажми на шар, чтобы пропустить";
    else if (state === "paused") h = "Нажми ▶, чтобы продолжить";
    else if (state === "ended") h = "Итог — в чате с ботом";
    hintEl.textContent = h;
  }
  function showError(msg) { errEl.textContent = msg; }

  function addUsage(src) {
    for (const [k, v] of Object.entries(src || {})) if (typeof v === "number") usage[k] = (usage[k] || 0) + v;
  }

  // ---------- subtitles / history ----------
  function nearBottom() { return subsEl.scrollHeight - subsEl.scrollTop - subsEl.clientHeight < 80; }
  function addEntry(role, text, pending) {
    const el = document.createElement("p");
    el.className = `line ${role}`;
    const e = { role, text: "", el, pending: false, dropped: false };
    entries.push(e);
    const stick = nearBottom();
    subsEl.appendChild(el);
    if (role === "assistant") {
      subsEl.querySelectorAll(".assistant.latest").forEach((n) => n.classList.remove("latest"));
      el.classList.add("latest");
    }
    setText(e, text, pending);
    if (stick) subsEl.scrollTop = subsEl.scrollHeight;
    return e;
  }
  function setText(e, text, pending) {
    const stick = nearBottom();
    e.text = text; e.pending = !!pending;
    e.el.textContent = text;
    e.el.classList.toggle("pending", !!pending);
    if (stick) subsEl.scrollTop = subsEl.scrollHeight;
  }
  function removeEntry(e) {
    const i = entries.indexOf(e);
    if (i >= 0) entries.splice(i, 1);
    e.el.remove();
  }
  function history() {
    return entries.filter((e) => !e.pending && !e.dropped && e.text).map((e) => ({ role: e.role, text: e.text }));
  }

  async function save(isEnd) {
    if (!sessionId) return;
    try {
      await fetch("/talk/transcript", {
        method: "POST", headers: authHeaders(true), keepalive: true,
        body: JSON.stringify({ session_id: sessionId, transcript: history(), usage, ended: !!isEnd }),
      });
    } catch (e) { if (isEnd) showError("Не удалось сохранить разговор: " + e.message); }
  }

  // ---------- wake lock ----------
  async function keepAwake() {
    if (!("wakeLock" in navigator)) { diag["экран не гаснет"] = "нет API"; renderDiag(); return; }
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      diag["экран не гаснет"] = "да";
      wakeLock.addEventListener("release", () => { diag["экран не гаснет"] = "отпущен"; renderDiag(); });
    } catch (e) { diag["экран не гаснет"] = "ошибка: " + e.name; }
    renderDiag();
  }
  document.addEventListener("visibilitychange", () => {
    if (!sessionId || state === "ended") return;
    if (document.visibilityState === "visible") { keepAwake(); ctx && ctx.resume(); }
    else save(false);
  });

  // ---------- audio in: VAD + capture ----------
  const WORKLET = `class Tap extends AudioWorkletProcessor {
    constructor() { super(); this.buf = new Float32Array(1024); this.n = 0; }
    process(inputs) {
      const ch = inputs[0] && inputs[0][0];
      if (ch) for (let i = 0; i < ch.length; i++) {
        this.buf[this.n++] = ch[i];
        if (this.n === this.buf.length) { this.port.postMessage(this.buf.slice(0)); this.n = 0; }
      }
      return true;
    }
  }
  registerProcessor("tap", Tap);`;

  function onChunk(f32) {
    const dt = (f32.length / ctx.sampleRate) * 1000;
    const now = performance.now();

    preroll.push(f32); prerollMs += dt;
    while (prerollMs > CFG.PREROLL_MS + CFG.BARGE_MS && preroll.length > 1) {
      prerollMs -= (preroll.shift().length / ctx.sampleRate) * 1000;
    }

    let sum = 0;
    for (let i = 0; i < f32.length; i++) sum += f32[i] * f32[i];
    const rms = Math.sqrt(sum / f32.length);
    level = rms;
    // room level = quietest moment of the last NOISE_WINDOW_MS (not while the bot talks — the mic hears it then)
    if (state !== "speaking") {
      noiseWin.push(rms); noiseWinMs += dt;
      while (noiseWinMs > CFG.NOISE_WINDOW_MS && noiseWin.length > 1) { noiseWin.shift(); noiseWinMs -= dt; }
      let m = Infinity;
      for (const v of noiseWin) if (v < m) m = v;
      noise = noise * 0.8 + Math.max(0.001, Math.min(0.03, m)) * 0.2;
    }
    const startThr = Math.max(noise * CFG.START_FACTOR, 0.006);
    let thr;
    if (state === "speaking") {
      thr = Math.max(startThr * 1.6, echo * CFG.BARGE_ECHO_FACTOR);
      if (rms < thr) echo = echo * 0.95 + rms * 0.05;  // track the bot's leak, not her voice
    } else if (utter.hasSpeech) {
      thr = Math.max(noise * CFG.KEEP_FACTOR, 0.004);
    } else {
      thr = startThr;
    }
    lastThr = thr;

    aboveStreak = rms > thr && now > ignoreUntil ? aboveStreak + 1 : 0;
    const voiced = aboveStreak >= 2;  // a one-frame spike (a clink, a click) isn't voice
    if (voiced) {
      if (voicedRun === 0) runStartedAt = now;
      voicedRun += dt; lastVoicedAt = now;
      if (utter.hasSpeech) peak = Math.max(peak, rms);
    }
    else if (now - lastVoicedAt > CFG.RUN_RESET_MS) voicedRun = 0;
    else voicedRun = Math.max(0, voicedRun - dt * 0.5);  // short gaps between words only slow it down

    // keep recording while a check is in flight too — if she carries on, that audio is part of the same utterance
    if ((state === "listening" || state === "thinking") && utter.hasSpeech) { utter.chunks.push(f32); utter.ms += dt; }

    const need = state === "speaking" ? CFG.BARGE_MS : CFG.MIN_SPEECH_MS;
    if (!voiceActive && voicedRun >= need) { voiceActive = true; onVoiceStart(); }
    if (voiceActive && now - lastVoicedAt > CFG.VOICE_GAP_MS) voiceActive = false;
    document.body.classList.toggle("voice", voiceActive);
  }

  function beginUtterFromPreroll() {
    utter.chunks = preroll.slice();
    utter.ms = prerollMs;
    utter.hasSpeech = true;
    utter.startedAt = performance.now();
    if (!utter.entry) utter.entry = addEntry("user", utter.prefix ? utter.prefix + " …" : "…", true);
  }

  function onVoiceStart() {
    if (state === "speaking") { bargeIn(); return; }
    if (state !== "listening" && state !== "thinking") return;
    if (inflight) { inflight.ac.abort(); inflight = null; setState("listening"); }  // she carried on — the check is moot
    if (!utter.hasSpeech) beginUtterFromPreroll();
    waitingHint = false; renderHint();
  }

  function bargeIn() {
    const played = runStartedAt - playStartedAt;  // when she started talking over it, not when we noticed
    stopPlayback();
    if (lastTurn && played < CFG.EARLY_BARGE_MS) {
      // The bot answered while she was still mid-thought: drop its answer, keep her words as a prefix.
      lastTurn.botEntry.dropped = true;
      lastTurn.botEntry.el.classList.add("dropped");
      lastTurn.botEntry.el.classList.remove("latest");
      if (lastTurn.botEntry.trEl) lastTurn.botEntry.trEl.remove();  // the merged turn will bring them back
      utter = newUtter();
      utter.prefix = lastTurn.userText;
      utter.entry = lastTurn.userEntry;
      setText(utter.entry, utter.prefix + " …", true);
    } else {
      if (lastTurn) setText(lastTurn.botEntry, lastTurn.botEntry.text + " —");
      utter = newUtter();
    }
    lastTurn = null;
    setState("listening");
    beginUtterFromPreroll();
    save(false);
  }

  // ---------- turns ----------
  function encodeWav(chunks, rate) {
    let total = 0;
    for (const c of chunks) total += c.length;
    const merged = new Float32Array(total);
    let off = 0;
    for (const c of chunks) { merged.set(c, off); off += c.length; }
    const ratio = rate / CFG.TARGET_RATE;
    const outLen = Math.floor(total / ratio);
    const buf = new ArrayBuffer(44 + outLen * 2);
    const v = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    w(0, "RIFF"); v.setUint32(4, 36 + outLen * 2, true); w(8, "WAVE"); w(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, CFG.TARGET_RATE, true); v.setUint32(28, CFG.TARGET_RATE * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, outLen * 2, true);
    for (let i = 0; i < outLen; i++) {
      const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.floor((i + 1) * ratio));
      let s = 0;
      for (let j = a; j < b && j < total; j++) s += merged[j];
      s = Math.max(-1, Math.min(1, s / (b - a)));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([buf], { type: "audio/wav" });
  }

  async function sendTurn(mode) {
    if (!utter.hasSpeech || !sessionId) return;
    if (inflight) inflight.ac.abort();
    const seq = ++turnSeq;
    const ac = new AbortController();
    inflight = { ac, seq };
    setState("thinking");
    const t0 = performance.now();
    const form = new FormData();
    form.append("session_id", String(sessionId));
    form.append("history", JSON.stringify(history()));
    form.append("prefix", utter.prefix);
    form.append("mode", mode);
    form.append("audio", encodeWav(utter.chunks, ctx.sampleRate), "turn.wav");
    let res;
    try {
      const r = await fetch("/talk/turn", { method: "POST", headers: authHeaders(false), body: form, signal: ac.signal });
      res = await r.json();
      if (!r.ok) throw new Error(res.error || r.status);
    } catch (e) {
      if (e.name === "AbortError" || !inflight || inflight.seq !== seq) return;
      inflight = null;
      showError("Ошибка: " + e.message);
      setState("listening");
      return;
    }
    if (!inflight || inflight.seq !== seq) return;  // she started talking again meanwhile
    inflight = null;
    showError("");
    addUsage(res.usage);
    const tm = res.timings || {};
    diag["последний ход"] = `${res.status}, stt ${tm.stt_ms ?? "—"} / llm ${tm.llm_ms ?? "—"} / tts ${tm.tts_ms ?? "—"} мс, всего ${Math.round(performance.now() - t0)} мс`;
    renderDiag();

    if (res.status === "empty") {
      if (utter.entry && !utter.prefix) removeEntry(utter.entry);
      else if (utter.entry) setText(utter.entry, utter.prefix);
      utter = newUtter();
      setState("listening");
      return;
    }
    if (res.status === "wait") {
      waitingHint = true;
      if (utter.entry) setText(utter.entry, res.user_text + " …", true);
      setState("listening");
      return;
    }
    if (performance.now() - lastVoicedAt < CFG.RESUME_GUARD_MS) {
      // she's talking right now — the answer is to half a thought; the next pause re-checks everything
      setState("listening");
      return;
    }
    // reply
    if (utter.entry) setText(utter.entry, res.user_text); else utter.entry = addEntry("user", res.user_text);
    const botEntry = addEntry("assistant", res.reply);
    if (res.translations && res.translations.length) {
      // the Russian words she dropped in, and the Spanish for them — visible, not just woven into the reply
      const tr = document.createElement("div");
      tr.className = "tr";
      tr.textContent = res.translations.map((p) => `${p.ru} → ${p.es}`).join(" · ");
      botEntry.el.after(tr);
      botEntry.trEl = tr;
    }
    lastTurn = { userText: res.user_text, userEntry: utter.entry, botEntry };
    utter = newUtter();
    waitingHint = false;
    save(false);
    await play(res.audio);
  }

  // ---------- audio out ----------
  async function play(b64) {
    try {
      const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
      const buf = await ctx.decodeAudioData(bytes.buffer);
      addUsage({ tts_seconds: buf.duration });
      const src = ctx.createBufferSource();
      src.buffer = buf;
      src.connect(ctx.destination);
      src.onended = () => {
        if (player !== src) return;
        player = null;
        if (state === "speaking") { ignoreUntil = performance.now() + CFG.ECHO_TAIL_MS; voicedRun = 0; setState("listening"); }
      };
      player = src;
      playStartedAt = performance.now();
      echo = Math.max(noise * CFG.START_FACTOR, 0.006);
      setState("speaking");
      src.start();
      diag["аудио"] = `${ctx.state}, ${ctx.sampleRate} Гц`; renderDiag();
    } catch (e) {
      diag["аудио"] = "ошибка: " + e.name; renderDiag();
      setState("listening");
    }
  }
  function stopPlayback() {
    if (!player) return;
    const p = player; player = null;
    try { p.stop(); } catch (e) {}
  }

  // ---------- timer: silence → check / stuck, ring ----------
  function tick() {
    diag["уровень / шум / порог"] = `${level.toFixed(4)} / ${noise.toFixed(4)} / ${lastThr.toFixed(4)}`;
    diag["пик голоса"] = peak ? peak.toFixed(4) : "—";
    if (document.getElementById("diag").classList.contains("open")) renderDiag();
    let progress = 0;
    if ((state === "listening" || state === "thinking") && utter.hasSpeech && !voiceActive) {
      const silence = performance.now() - lastVoicedAt;
      progress = Math.max(0, Math.min(1, (silence - 400) / (CFG.STUCK_MS - 400)));
      if (!inflight && silence >= CFG.STUCK_MS && stuckFor !== lastVoicedAt) {
        stuckFor = lastVoicedAt; sendTurn("stuck");
      } else if (!inflight && silence >= CFG.PAUSE_CHECK_MS && checkedFor !== lastVoicedAt) {
        checkedFor = lastVoicedAt; sendTurn("auto");
      }
    }
    if (state === "listening" && utter.hasSpeech && utter.ms > CFG.MAX_UTTER_MS && !inflight) sendTurn("done");
    ringCircle.style.strokeDashoffset = RING_LEN * (1 - progress);
  }

  // ---------- start / pause / end ----------
  async function start() {
    if (!initData && !linkToken) return;
    // AudioContext must be created inside the tap on iOS, before any await.
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    ctx.resume();
    setState("starting"); showError("");
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      const track = micStream.getAudioTracks()[0];
      diag["микрофон"] = "да (" + (track.label || "без имени") + ")"; renderDiag();
      await ctx.resume();
      await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" })));
      const node = new AudioWorkletNode(ctx, "tap");
      node.port.onmessage = (e) => onChunk(e.data);
      const mute = ctx.createGain();
      mute.gain.value = 0;  // the node has to be pulled by the destination to run, but we don't want to hear the mic
      ctx.createMediaStreamSource(micStream).connect(node);
      node.connect(mute).connect(ctx.destination);
      diag["аудио"] = `${ctx.state}, ${ctx.sampleRate} Гц`; renderDiag();
    } catch (e) {
      diag["микрофон"] = "ошибка: " + e.name; renderDiag();
      showError("Нет доступа к микрофону (" + e.name + "). Попробуй открыть в Safari.");
      setState("idle"); return;
    }
    keepAwake();

    try {
      const r = await fetch("/talk/start", { method: "POST", headers: authHeaders(true), body: "{}" });
      const res = await r.json();
      if (!r.ok) throw new Error(res.error || r.status);
      sessionId = res.session_id;
      diag["сессия"] = `#${sessionId}, целевых слов: ${res.target_count}`; renderDiag();
      addUsage(res.usage);
      addEntry("assistant", res.reply);
      pauseBtn.disabled = false; endBtn.disabled = false;
      if (tg && tg.enableClosingConfirmation) tg.enableClosingConfirmation();
      tickTimer = setInterval(tick, 100);
      await play(res.audio);
    } catch (e) {
      showError("Не получилось начать: " + e.message);
      setState("idle");
    }
  }

  function togglePause() {
    if (!sessionId || state === "ended") return;
    if (state === "paused") {
      pauseBtn.textContent = "❚❚";
      setState("listening");
      return;
    }
    stopPlayback();
    if (inflight) { inflight.ac.abort(); inflight = null; }
    if (utter.entry && utter.entry.pending) removeEntry(utter.entry);
    utter = newUtter(); waitingHint = false;
    pauseBtn.textContent = "▶";
    setState("paused");
  }

  async function end() {
    if (!sessionId || state === "ended") return;
    stopPlayback();
    if (inflight) { inflight.ac.abort(); inflight = null; }
    clearInterval(tickTimer);
    try { micStream && micStream.getTracks().forEach((t) => t.stop()); } catch (e) {}
    try { wakeLock && wakeLock.release(); } catch (e) {}
    if (utter.entry && utter.entry.pending) removeEntry(utter.entry);
    setState("ended");
    pauseBtn.disabled = true; endBtn.disabled = true;
    ringCircle.style.strokeDashoffset = RING_LEN;
    await save(true);
    try { ctx && ctx.close(); } catch (e) {}
    if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation();
  }

  $("orb").onclick = () => {
    if (state === "idle") { start(); return; }
    if (state === "ended") { location.reload(); return; }
    if (state === "paused") { togglePause(); return; }
    if (state === "speaking") {  // skip the rest of the bot's line
      stopPlayback(); ignoreUntil = performance.now() + CFG.ECHO_TAIL_MS; setState("listening"); return;
    }
    if ((state === "listening" || state === "thinking") && utter.hasSpeech) sendTurn("done");  // "I'm done"
  };
  pauseBtn.onclick = togglePause;
  endBtn.onclick = end;
})();
</script>
</body>
</html>
